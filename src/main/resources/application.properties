spring.application.name=blooms
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/blooms_db}

# OTP/Auth
app.auth.otp.expiry-seconds=${OTP_EXPIRY_SECONDS:300}
app.auth.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:45}
app.auth.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.auth.otp.delivery=${OTP_DELIVERY:LOG}
app.auth.otp.debug-return-in-response=${OTP_DEBUG_RETURN:false}
app.auth.otp.sender=${OTP_SENDER:${MAIL_FROM:no-reply@blooms.local}}

# JWT/Auth Session
app.auth.jwt.secret=${JWT_SECRET:blooms-default-jwt-secret-key-change-in-production-please-change-this-key-2026}
app.auth.jwt.access-token-expiry-seconds=${JWT_ACCESS_TOKEN_EXPIRY_SECONDS:900}
app.auth.jwt.refresh-token-expiry-seconds=${JWT_REFRESH_TOKEN_EXPIRY_SECONDS:1209600}

# Cloudinary Media Upload
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:blooms}

# OpenRouter AI
app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
app.ai.openrouter.model=${OPENROUTER_MODEL:google/gemini-2.5-flash:free}
app.ai.openrouter.fallback-model=${OPENROUTER_FALLBACK_MODEL:meta-llama/llama-3-8b-instruct:free}
app.ai.openrouter.site-url=${OPENROUTER_SITE_URL:http://localhost:8080}
app.ai.openrouter.app-title=${OPENROUTER_APP_TITLE:Blooms Blog Chatbot}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# SMTP (required only when OTP_DELIVERY=EMAIL)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}
