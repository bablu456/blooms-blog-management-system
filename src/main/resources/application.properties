spring.application.name=blooms
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/blooms_db}

# OTP/Auth
app.auth.otp.expiry-seconds=${OTP_EXPIRY_SECONDS:300}
app.auth.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:45}
app.auth.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.auth.otp.delivery=${OTP_DELIVERY:LOG}
app.auth.otp.debug-return-in-response=${OTP_DEBUG_RETURN:false}
app.auth.otp.sender=${OTP_SENDER:no-reply@blooms.local}

# JWT/Auth Session
app.auth.jwt.secret=${JWT_SECRET:blooms-default-jwt-secret-key-change-in-production-please-change-this-key-2026}
app.auth.jwt.access-token-expiry-seconds=${JWT_ACCESS_TOKEN_EXPIRY_SECONDS:900}
app.auth.jwt.refresh-token-expiry-seconds=${JWT_REFRESH_TOKEN_EXPIRY_SECONDS:1209600}

# Cloudinary Media Upload
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:blooms}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# SMTP (required only when OTP_DELIVERY=EMAIL)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
